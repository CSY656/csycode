[project]
name = "csycode"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # ── TUI ──────────────────────────────────────────────────
    "textual>=0.8",
    "rich>=13",
    # ── LLM ──────────────────────────────────────────────────
    "openai>=1.0",
    "anthropic>=0.50",
    # ── MCP ──────────────────────────────────────────────────
    "mcp>=1.0",
    # ── 基础 ──────────────────────────────────────────────────
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.scripts]
csycode = "csycode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csycode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.6"]
